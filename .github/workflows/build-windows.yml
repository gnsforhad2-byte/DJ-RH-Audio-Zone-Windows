name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout source and audio assets
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows native audio helper
        run: npm run build:native:win

      - name: Build VST3 plugin
        run: npm run build:vst3:win

      - name: Diagnose VST3 bundle contents
        shell: pwsh
        run: |
          $bundle = "build/vst3-cmake/VST3/Release/DJ RH Audio Zone.vst3"
          if (!(Test-Path -LiteralPath $bundle -PathType Container)) {
            throw "VST3 bundle directory not found: $bundle"
          }
          Get-ChildItem -LiteralPath $bundle -Force -Recurse |
            Select-Object FullName, Length, Mode |
            Format-Table -AutoSize

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify VST3 bundle
        shell: pwsh
        run: |
          $plugin = "build/vst3-cmake/VST3/Release/DJ RH Audio Zone.vst3/Contents/x86_64-win/DJ RH Audio Zone.vst3"
          if (!(Test-Path -LiteralPath $plugin -PathType Leaf)) {
            throw "VST3 plugin binary not found: $plugin"
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJ-RH-Audio-Zone-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
